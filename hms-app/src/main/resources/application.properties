spring.application.name=hms
# 8080 is avoided on purpose: it is commonly taken by other software (Oracle XE, Jenkins, Tomcat).
server.port=8088

# MongoDB is the system of record. Override with --spring.mongodb.uri=... for another server or database.
spring.mongodb.uri=mongodb://localhost:27017/hms

server.tomcat.threads.max=200
logging.level.org.mongodb.driver=WARN

# ---- HMS settings (see HmsProperties) ----------------------------------------------------------
# Worker id of this application server for the Snowflake ID generator; must differ per instance (0-1023).
hms.worker-id=1
# Set true only when running behind a load balancer that sets X-Forwarded-For.
hms.trust-proxy=false
hms.bcrypt-strength=10

# Key-value cache cluster. Embedded mode starts the nodes inside this JVM on consecutive ports.
hms.kv.embedded=true
hms.kv.nodes=3
hms.kv.base-port=7101
hms.kv.replicas=2
hms.kv.virtual-nodes=150
hms.kv.max-entries-per-node=200000

hms.cache.enabled=true
hms.rate-limit.enabled=true

# Synthetic starting data, created once when the database is empty.
hms.seed.enabled=true
hms.seed.doctors=200
hms.seed.medicines=400

# Simulated external websites for the crawler (drug information and insurance plans).
hms.mock-sites.enabled=true
hms.mock-sites.base-port=9101
hms.mock-sites.latency-ms=20
hms.mock-sites.drugs=600
