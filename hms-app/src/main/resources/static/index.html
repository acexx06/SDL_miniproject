<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMS · Hospital Management System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a75'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
<style>
  /* ---- design tokens ------------------------------------------------------------------ */
  /* Light (white and orange) is the default. Dark is only used when chosen with the theme button. */
  :root {
    color-scheme: light;
    --bg: #fcfaf8; --surface: #ffffff; --surface-2: #fbf3ec; --text: #1f1a17; --text-2: #57493f; --muted: #7a6a5f;
    --line: #f0e6dd; --line-strong: #e3d4c7;
    --accent: #cf4a0a; --accent-hover: #b4400a; --accent-text: #c2410c; --accent-soft: #fff0e4; --accent-bright: #f97316; --on-accent: #ffffff;
    --good: #15803d; --good-soft: #e8f6ec; --warn: #92400e; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fdecec;
    --danger: #c81e1e;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
    --chart-line: #eb6834; --grid: #ece6df; --axis: #d3c8bd; --chart-ink: #6b5d52;
    --sev-1: #d03b3b; --sev-2: #ec835a; --sev-3: #fab219; --sev-4: #8a97a0; --sev-5: #b9c3c9;
    --hero-1: #fff8f1; --hero-2: #ffe9d6; --hero-glow: #ffd2ad;
    --shadow: 0 1px 2px rgba(60, 30, 10, .04), 0 4px 12px rgba(60, 30, 10, .05);
    --shadow-lg: 0 18px 50px rgba(60, 30, 10, .16);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14100e; --surface: #1c1714; --surface-2: #241e1a; --text: #f5ede6; --text-2: #d4c4b6; --muted: #a8968a;
    --line: #33291f; --line-strong: #45382c;
    --accent: #fb8a3c; --accent-hover: #fda65f; --accent-text: #fb8a3c; --accent-soft: #3a2416; --accent-bright: #fb8a3c; --on-accent: #1a0c03;
    --good: #7fd9a2; --good-soft: #15301f; --warn: #ffcf66; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1c1a;
    --danger: #d23b3b;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
    --chart-line: #d95926; --grid: #2c2622; --axis: #45382c; --chart-ink: #c3b6aa;
    --sev-4: #7b8a93; --sev-5: #55646c;
    --hero-1: #1c1511; --hero-2: #2a1a10; --hero-glow: #4a2510;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5);
  }

  /* ---- base ----------------------------------------------------------------------------- */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  h1 { font-size: 26px; letter-spacing: -.01em; }
  h2 { font-size: 16px; }
  h3 { font-size: 14px; }
  p { margin: 0; }
  a { color: var(--accent-text); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- shell ---------------------------------------------------------------------------- */
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 16px;
    background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; text-decoration: none; color: var(--text); }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
  .brand-mark svg { width: 20px; height: 20px; fill: var(--on-accent); }
  .brand b { display: block; font-size: 15px; }
  .brand span { font-size: 12px; color: var(--muted); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .nav a.danger { color: var(--bad); }
  .nav a.danger[aria-current="page"] { background: var(--bad-soft); }
  .sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .userbox { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    background: var(--accent-soft); color: var(--accent); flex: none; }
  .userbox .who { min-width: 0; }
  .userbox .who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot-actions { display: flex; gap: 6px; }
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 26px 40px 6px; width: 100%; max-width: 1520px; margin: 0 auto; }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar p { color: var(--muted); margin-top: 2px; }
  #menu-btn { display: none; }
  .page { padding: 18px 40px 56px; display: flex; flex-direction: column; gap: 22px; max-width: 1520px; width: 100%; margin: 0 auto; }
  .footnote { padding: 0 40px 24px; color: var(--muted); font-size: 12.5px; max-width: 1520px; width: 100%; margin: 0 auto; }
  .scrim { display: none; }

  /* ---- building blocks ------------------------------------------------------------------ */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head h2 { flex: 1; }
  .card-head p { width: 100%; color: var(--muted); font-size: 13.5px; }
  .grid { display: grid; gap: 18px; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--accent); background: var(--accent);
    color: var(--on-accent); padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
  .btn.secondary:hover { background: var(--surface-2); }
  .btn.ghost { background: transparent; color: var(--accent); border-color: transparent; padding-left: 8px; padding-right: 8px; }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover { filter: brightness(1.08); }
  .btn.small { padding: 5px 10px; font-size: 13px; font-weight: 500; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 7px; cursor: pointer; display: inline-grid; place-items: center; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { min-height: 76px; resize: vertical; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
  .form-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
    background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
  .chip svg.i { width: 13px; height: 13px; stroke-width: 2.4; }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.accent { background: var(--accent-soft); color: var(--accent-text); }
  .powered { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft);
    border-radius: 6px; padding: 2px 8px; }
  .powered svg.i { width: 13px; height: 13px; }

  .tabs { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 9px; gap: 2px; }
  .tabs button { border: 0; background: none; color: var(--text-2); padding: 6px 14px; border-radius: 7px; font: inherit; font-weight: 500; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .stat { padding: 16px 18px; }
  .stat .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat .value { font-size: 28px; font-weight: 650; margin-top: 6px; line-height: 1.2; }
  .stat .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  .list { display: flex; flex-direction: column; }
  .list > .item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .list > .item:first-child { border-top: 0; padding-top: 2px; }
  .item .body { flex: 1; min-width: 0; }
  .item .body b { display: block; }
  .datebox { width: 52px; flex: none; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 6px 0; line-height: 1.1; }
  .datebox b { display: block; font-size: 19px; }
  .datebox span { font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
  .empty svg.i { width: 30px; height: 30px; display: block; margin: 0 auto 8px; opacity: .6; }
  .loading { color: var(--muted); padding: 20px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.r, th.r { text-align: right; }
  .table-wrap { overflow-x: auto; }

  /* search with suggestions */
  .combo { position: relative; }
  .searchbar { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; background: var(--surface); }
  .searchbar:focus-within { outline: 2px solid var(--accent); border-color: var(--accent); }
  .searchbar svg.i { color: var(--muted); }
  .searchbar input { border: 0; padding: 12px 0; font-size: 16px; background: transparent; }
  .searchbar input:focus { outline: none; }
  .combo-list { list-style: none; margin: 6px 0 0; padding: 6px; position: absolute; z-index: 20; left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 360px; overflow-y: auto; }
  .combo-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .combo-list li[aria-selected="true"], .combo-list li:hover { background: var(--accent-soft); }
  .combo-list li .t { flex: 1; min-width: 0; }
  .combo-meta { font-size: 12.5px; color: var(--muted); min-height: 19px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .pill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); border-radius: 99px; padding: 6px 13px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* doctor cards */
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .doc { display: flex; flex-direction: column; gap: 12px; }
  .doc-top { display: flex; gap: 12px; align-items: center; }
  .doc .avatar { width: 44px; height: 44px; font-size: 15px; }
  .doc-meta { display: flex; gap: 14px; font-size: 13.5px; color: var(--text-2); }
  .doc-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .doc-meta svg.i { width: 15px; height: 15px; }

  /* date and slot pickers */
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .day { flex: none; width: 62px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 0; text-align: center; cursor: pointer; color: var(--text); font: inherit; line-height: 1.2; }
  .day small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .day b { font-size: 18px; }
  .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .day[aria-pressed="true"] small { color: inherit; }
  .day:disabled { opacity: .35; cursor: not-allowed; }
  .slot-group h3 { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
  .slot { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 0; font: inherit; font-size: 14px; cursor: pointer; }
  .slot:hover:not(:disabled) { border-color: var(--accent); }
  .slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .slot:disabled { color: var(--muted); background: var(--surface-2); text-decoration: line-through; cursor: not-allowed; border-color: var(--line); }

  /* bills */
  .bill { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .bill.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .bill-lines { font-size: 13.5px; color: var(--text-2); margin: 8px 0; }
  .bill-lines div { display: flex; justify-content: space-between; gap: 12px; }
  .meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .amount { font-size: 22px; font-weight: 650; }
  .linkbox { display: flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 6px 6px 6px 10px; margin-top: 10px; }
  .linkbox a { flex: 1; min-width: 0; }

  /* emergency */
  .sev-group { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .sev-group label { margin: 0; }
  .sev-group input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sev-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer; text-align: center; font-size: 12.5px; color: var(--text-2); }
  .sev-opt i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .sev-opt b { font-size: 15px; color: var(--text); }
  .sev-group input:checked + .sev-opt { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .sev-group input:focus-visible + .sev-opt { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sev-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .eta { font-size: 44px; font-weight: 700; line-height: 1; }
  .hero-emergency { border-left: 4px solid var(--danger); }

  /* welcome */
  .hero { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
  .hero h1 { font-size: 28px; margin-bottom: 8px; }
  .quick { display: flex; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--text); background: var(--surface); }
  .quick:hover { border-color: var(--accent); }
  .quick .qi { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .quick-grid .quick { flex-direction: column; align-items: flex-start; gap: 10px; }
  .quick.danger .qi { background: var(--bad-soft); color: var(--bad); }
  .demo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .demo { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font: inherit; color: var(--text); cursor: pointer; }
  .demo:hover { border-color: var(--accent); background: var(--accent-soft); }
  .demo .avatar { width: 32px; height: 32px; font-size: 12px; }
  .demo small { display: block; color: var(--muted); font-size: 12px; }

  /* system */
  .comp { display: flex; flex-direction: column; gap: 4px; }
  .comp .k { font-size: 22px; font-weight: 650; }
  .comp-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .comp-head .qi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .switch:first-of-type { border-top: 0; }
  .toggle { position: relative; width: 44px; height: 24px; border-radius: 99px; border: 0; background: var(--line-strong); cursor: pointer; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .toggle[aria-checked="true"] { background: var(--accent); }
  .toggle[aria-checked="true"]::after { transform: translateX(20px); }
  .chart-host { position: relative; }
  .chart-host svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-host svg:focus { outline: none; }
  .chart-host svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg);
    padding: 7px 10px; font-size: 12.5px; white-space: nowrap; z-index: 5; display: none; }
  .tooltip b { display: block; font-size: 15px; }
  .tooltip .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .donut-wrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 18px; align-items: center; }
  .keydot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  details.tableview summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }

  /* dialog and toasts */
  dialog { border: 0; padding: 0; border-radius: 14px; box-shadow: var(--shadow-lg); background: var(--surface); color: var(--text); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
  dialog::backdrop { background: rgba(10, 18, 22, .45); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px; }
  .dlg-head h2 { flex: 1; font-size: 17px; }
  .dlg-body { padding: 4px 20px 8px; overflow-y: auto; max-height: calc(100vh - 190px); }

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">

<script>
'use strict';

// ===== helpers ===================================================================================

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const money = paise => '₹' + (paise / 100).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (x, digits = 1) => (x * 100).toFixed(digits) + '%';
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : Math.round(n).toLocaleString('en-IN');
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => isoDay(new Date());
const nowHHMM = () => new Date().toTimeString().slice(0, 5);
const parseDay = s => new Date(s + 'T00:00:00');
const fmtDay = s => parseDay(s).toLocaleDateString('en-IN', {weekday: 'short', day: 'numeric', month: 'short'});
const fmtDateTime = s => new Date(s).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const initials = name => String(name || '?').replace(/^Dr\.?\s*/, '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  pill: '<path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 10l7 7"/>',
  siren: '<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14M12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4M4 18h16"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  userplus: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/>',
  login: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  copy: '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  gauge: '<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 14l4-5"/>',
  hash: '<path d="M5 9h15M4 15h15M10 3L8 21M16 3l-2 18"/>',
  zap: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  stethoscope: '<path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>',
  ambulance: '<path d="M3 7h11v10H3zM14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M8.5 9.5v4M6.5 11.5h4"/>',
  heart: '<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
};
const icon = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
const powered = (what, title) => `<span class="powered" title="${esc(title || '')}">${icon('zap')}${esc(what)}</span>`;
const empty = (ic, text) => `<div class="empty">${icon(ic)}${esc(text)}</div>`;

const STATUS = {
  BOOKED: ['good', 'check', 'Booked'], COMPLETED: ['', 'check', 'Completed'], CANCELLED: ['bad', 'x', 'Cancelled'],
  PAID: ['good', 'check', 'Paid'], UNPAID: ['warn', 'clock', 'Unpaid'],
  ISSUED: ['warn', 'clock', 'Waiting at pharmacy'], DISPENSING: ['warn', 'clock', 'Dispensing'], DISPENSED: ['good', 'check', 'Dispensed'],
  QUEUED: ['warn', 'clock', 'Queued'], DISPATCHED: ['good', 'ambulance', 'Dispatched'], RESOLVED: ['', 'check', 'Resolved'],
  FREE: ['good', 'check', 'Free'], BUSY: ['warn', 'ambulance', 'On a call'],
};
const chip = (cls, ic, text) => `<span class="chip ${cls}">${icon(ic)}${esc(text)}</span>`;
const statusChip = s => { const [cls, ic, text] = STATUS[s] || ['', 'clock', s]; return `<span class="chip ${cls}">${icon(ic)}${esc(text)}</span>`; };
const SEVERITY = {1: 'Critical', 2: 'Serious', 3: 'Urgent', 4: 'Moderate', 5: 'Minor'};
const sevChip = n => `<span class="chip"><span class="sev-dot" style="background:var(--sev-${n})"></span>${n} · ${SEVERITY[n]}</span>`;
const RECORD_TYPES = {DIAGNOSIS: 'Diagnosis', LAB_RESULT: 'Lab result', VITALS: 'Vitals', NOTE: 'Note'};

// ===== state, API, feedback =====================================================================

const state = {token: null, user: null, timers: [], charts: {}};
try { state.token = localStorage.getItem('hms.token'); } catch { /* storage unavailable */ }

async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }
  if (!res.ok) {
    if (res.status === 401 && state.token && !path.startsWith('/api/auth/')) { setSession(null); toast('Your session has ended. Please sign in again.', true); go('welcome'); }
    const err = new Error(res.status === 429 ? 'Too many requests. Please wait a moment and try again.' : (data && data.error) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

function toast(message, bad = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = icon(bad ? 'alert' : 'check');
  const span = document.createElement('span');
  span.textContent = message;
  el.appendChild(span);
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 4200);
}

/** Runs an async action, turning any error into a red toast. Returns undefined on failure. */
const attempt = fn => async (...args) => { try { return await fn(...args); } catch (e) { toast(e.message, true); } };

function setSession(result) {
  state.token = result ? result.token : null;
  state.user = result ? result.user : null;
  try { result ? localStorage.setItem('hms.token', result.token) : localStorage.removeItem('hms.token'); } catch { /* ignore */ }
}

const every = (fn, ms) => { state.timers.push(setInterval(fn, ms)); };
const stopTimers = () => { state.timers.forEach(clearInterval); state.timers = []; };

// ===== dialogs ==================================================================================

/** Opens the shared dialog. `body` is HTML; `onMount(root, close)` wires it up. Resolves with what close() was given. */
function openModal({title, body, actions = '', wide = false, onMount}) {
  const dlg = $('#modal');
  dlg.style.width = wide ? 'min(760px, calc(100vw - 32px))' : '';
  dlg.innerHTML = `<div class="dlg-head"><h2 id="modal-title">${esc(title)}</h2>
    <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="dlg-body">${body}</div>${actions ? `<div class="dlg-foot">${actions}</div>` : ''}`;
  return new Promise(resolve => {
    let result;
    const close = value => { result = value; dlg.close(); };
    dlg.onclose = () => resolve(result);
    $$('[data-close]', dlg).forEach(b => { b.onclick = () => close(undefined); });
    dlg.showModal();
    if (onMount) onMount(dlg, close);
  });
}

function confirmDialog({title, text, confirm = 'Confirm', danger = false, extra = ''}) {
  return openModal({title, body: `<p>${esc(text)}</p>${extra}`,
    actions: `<button class="btn secondary" data-close>Keep as is</button><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(confirm)}</button>`,
    onMount: (root, close) => { const ok = $('[data-ok]', root); ok.focus(); ok.onclick = () => close(root.querySelector('form') ? new FormData(root.querySelector('form')) : true); }});
}

// ===== search box with suggestions ==============================================================

/**
 * Turns `<div class="combo"><div class="searchbar"><input></div><ul class="combo-list"></ul></div>` into an
 * accessible autocomplete: one request per pause in typing, arrow keys and Enter to choose, Escape to close.
 */
function suggestBox(input, {fetch, render, onPick, meta}) {
  const combo = input.closest('.combo');
  const list = $('.combo-list', combo);
  const metaEl = meta ? $(meta) : null;
  let items = [];
  let active = -1;
  let seq = 0;
  list.id = list.id || 'lb-' + Math.random().toString(36).slice(2);
  list.setAttribute('role', 'listbox');
  list.hidden = true;
  Object.entries({role: 'combobox', 'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': list.id, autocomplete: 'off'})
    .forEach(([k, v]) => input.setAttribute(k, v));
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); active = -1; };
  const mark = i => {
    active = i;
    $$('li', list).forEach((li, j) => li.setAttribute('aria-selected', String(j === i)));
    if (i >= 0) { input.setAttribute('aria-activedescendant', `${list.id}-${i}`); list.children[i].scrollIntoView({block: 'nearest'}); }
  };
  const pick = i => { const item = items[i]; close(); if (item) onPick(item); };
  input.addEventListener('input', debounce(async () => {
    const q = input.value.trim();
    const mine = ++seq;
    if (!q) { close(); if (metaEl) metaEl.innerHTML = ''; return; }
    const t0 = performance.now();
    try {
      const found = await fetch(q);
      if (mine !== seq) return; // a newer keystroke has already been answered
      items = found;
      const ms = performance.now() - t0;
      if (metaEl) metaEl.innerHTML = `${powered('Autocomplete', 'Answered from the in-memory trie index, not the database')}
        <span>${plural(items.length, 'suggestion')} in ${ms.toFixed(1)} ms</span>`;
      list.innerHTML = items.map((it, i) => `<li role="option" id="${list.id}-${i}" aria-selected="false" data-i="${i}">${render(it)}</li>`).join('');
      list.hidden = items.length === 0;
      input.setAttribute('aria-expanded', String(items.length > 0));
      active = -1;
    } catch (e) {
      if (metaEl) metaEl.textContent = e.status === 429 ? 'Typing faster than the rate limiter allows. Pause for a moment.' : e.message;
      close();
    }
  }, 70));
  input.addEventListener('keydown', e => {
    if (list.hidden && e.key !== 'Enter') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); mark(Math.min(items.length - 1, active + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); mark(Math.max(0, active - 1)); }
    else if (e.key === 'Enter' && !list.hidden && active >= 0) { e.preventDefault(); pick(active); }
    else if (e.key === 'Escape') { close(); }
  });
  list.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  input.addEventListener('blur', () => setTimeout(close, 120));
}

const comboHtml = (id, placeholder, label) => `<div class="combo">
  <label class="sr-only" for="${id}">${esc(label)}</label>

// ===== charts (SVG, drawn by hand) ==============================================================

/** Rounds up to 1, 2, 2.5 or 5 times a power of ten, for axis maxima. */
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(m => m >= v);
}

/**
 * A single-series line chart of the last `windowMs` of samples, with a crosshair and tooltip that follow the
 * pointer (or the arrow keys) to the nearest sample.
 */
function lineChart(host, {name, color, format, windowMs = 120000, yMax: fixedMax}) {
  host.classList.add('chart-host');
  const tip = document.createElement('div');
  tip.className = 'tooltip';
  host.appendChild(tip);
  let points = [];
  let hover = null;
  let svg = null;
  const H = 190, M = {l: 46, r: 14, t: 12, b: 26};

  function geometry() {
    const W = Math.max(300, host.clientWidth);
    const now = points.length ? points[points.length - 1].t : Date.now();
    const yMax = fixedMax || niceMax(Math.max(...points.map(p => p.v ?? 0), 0) * 1.1);
    const x = t => M.l + (W - M.l - M.r) * (1 - (now - t) / windowMs);
    const y = v => M.t + (H - M.t - M.b) * (1 - v / yMax);
    return {W, now, yMax, x, y};
  }

  function draw() {
    const {W, yMax, x, y} = geometry();
    const ticks = [0, yMax / 2, yMax];
    let grid = ticks.map(v => `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${M.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--chart-ink)">${esc(format(v, true))}</text>`).join('');
    grid += [[windowMs, `−${Math.round(windowMs / 60000)} min`], [windowMs / 2, `−${Math.round(windowMs / 120000)} min`], [0, 'now']]
      .map(([ago, text]) => `<text x="${M.l + (W - M.l - M.r) * (1 - ago / windowMs)}" y="${H - 6}" text-anchor="${ago === 0 ? 'end' : ago === windowMs ? 'start' : 'middle'}" font-size="11" fill="var(--chart-ink)">${text}</text>`).join('');
    let line = '';
    let area = '';
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        const d = run.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
        line += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        area += `<path d="${d}L${x(run[run.length - 1].t).toFixed(1)},${y(0)}L${x(run[0].t).toFixed(1)},${y(0)}Z" fill="${color}" opacity="0.1"/>`;
      }
      run = [];
    };
    points.forEach(p => { if (p.v == null) flush(); else run.push(p); });
    flush();
    const last = [...points].reverse().find(p => p.v != null);
    const end = last ? `<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>` : '';
    host.querySelector('svg')?.remove();
    host.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img"
      aria-label="${esc(name)} over the last ${Math.round(windowMs / 60000)} minutes${last ? ', latest ' + esc(format(last.v)) : ''}">
      ${grid}<line x1="${M.l}" x2="${W - M.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
      ${area}${line}${end}<g class="xhair"></g><rect class="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/></svg>`);
    svg = host.querySelector('svg');
    const pickAt = clientX => {
      const r = svg.getBoundingClientRect();
      const px = (clientX - r.left) * (W / r.width);
      let best = null;
      points.forEach((p, i) => { if (p.v != null && (best === null || Math.abs(x(p.t) - px) < Math.abs(x(points[best].t) - px))) best = i; });
      return best;
    };
    svg.addEventListener('pointermove', e => { hover = pickAt(e.clientX); showHover(); });
    svg.addEventListener('pointerleave', () => { hover = null; showHover(); });
    svg.addEventListener('focus', () => { if (hover == null) hover = points.length - 1; showHover(); });
    svg.addEventListener('blur', () => { hover = null; showHover(); });
    svg.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      hover = Math.max(0, Math.min(points.length - 1, (hover ?? points.length - 1) + (e.key === 'ArrowLeft' ? -1 : 1)));
      showHover();
    });
    showHover();
  }

  function showHover() {
    const g = svg && svg.querySelector('.xhair');
    if (!g) return;
    const p = hover != null ? points[hover] : null;
    if (!p || p.v == null) { g.innerHTML = ''; tip.style.display = 'none'; return; }
    const {W, x, y} = geometry();
    g.innerHTML = `<line x1="${x(p.t)}" x2="${x(p.t)}" y1="${M.t}" y2="${H - M.b}" stroke="var(--axis)" stroke-width="1"/>
      <circle cx="${x(p.t)}" cy="${y(p.v)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    tip.innerHTML = '';
    const value = document.createElement('b');
    value.textContent = format(p.v);
    const label = document.createElement('div');
    label.innerHTML = `<span class="key" style="background:${color}"></span>`;
    label.append(`${name} · ${Math.max(0, Math.round((Date.now() - p.t) / 1000))} s ago`);
    tip.append(value, label);
    tip.style.display = 'block';
    const r = svg.getBoundingClientRect();
    const scale = r.width / W;
    const left = x(p.t) * scale;
    tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, y(p.v) * scale - tip.offsetHeight - 12) + 'px';
  }

  return {update(next) { points = next; draw(); }};
}

/** Donut of each cache server's share of the hash ring, with a hover tooltip per segment and direct labels. */
function donut(host, segments, centre) {
  host.classList.add('chart-host');
  const R = 80, r = 52, C = 90;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let a = -Math.PI / 2;
  const arc = (a0, a1) => {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    return `M${p(R, a0)}A${R},${R} 0 ${large} 1 ${p(R, a1)}L${p(r, a1)}A${r},${r} 0 ${large} 0 ${p(r, a0)}Z`;
  };
  const paths = segments.map((s, i) => {
    const a0 = a;
    const a1 = a + 2 * Math.PI * s.value / total;
    a = a1;
    const d = segments.length === 1 ? `M${C},${C - R}A${R},${R} 0 1 1 ${C - 0.01},${C - R}L${C - 0.01},${C - r}A${r},${r} 0 1 0 ${C},${C - r}Z` : arc(a0, a1);
    return `<path d="${d}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" data-i="${i}" tabindex="0" role="img"
      aria-label="${esc(s.label)}: ${pct(s.value / total)} of the ring"></path>`;
  }).join('');
  host.innerHTML = `<svg viewBox="0 0 180 180" width="180" height="180" style="max-width:180px">${paths}
    <text x="90" y="88" text-anchor="middle" font-size="26" font-weight="650" fill="var(--text)">${esc(centre[0])}</text>
    <text x="90" y="108" text-anchor="middle" font-size="12" fill="var(--chart-ink)">${esc(centre[1])}</text></svg><div class="tooltip"></div>`;
  const tip = $('.tooltip', host);
  const show = (el, ev) => {
    const s = segments[+el.dataset.i];
    $$('path', host).forEach(p => p.setAttribute('opacity', p === el ? '1' : '0.55'));
    tip.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = pct(s.value / total);
    const d = document.createElement('div');
    d.innerHTML = `<span class="key" style="background:${s.color}"></span>`;
    d.append(`${s.label} · ${s.detail}`);
    tip.append(b, d);
    tip.style.display = 'block';
    const hr = host.getBoundingClientRect();
    const er = el.getBoundingClientRect();
    tip.style.left = Math.max(0, (ev && ev.clientX ? ev.clientX : er.left + er.width / 2) - hr.left - tip.offsetWidth / 2) + 'px';
    tip.style.top = Math.max(0, (ev && ev.clientY ? ev.clientY : er.top) - hr.top - tip.offsetHeight - 12) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; $$('path', host).forEach(p => p.setAttribute('opacity', '1')); };
  $$('path', host).forEach(p => {
    p.addEventListener('pointermove', e => show(p, e));
    p.addEventListener('pointerleave', hide);
    p.addEventListener('focus', () => show(p));
    p.addEventListener('blur', hide);
  });
}

const role = () => state.user ? state.user.role : 'GUEST';
const go = (page, param) => { const hash = '#/' + page + (param ? '/' + param : ''); if (location.hash === hash) render(); else location.hash = hash; };

function parseRoute() {
  const [page, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  return {page: page || '', param: rest.length ? decodeURIComponent(rest.join('/')) : null};
}

function renderShell(active) {
  const r = role();
  const app = $('#app');
  app.classList.toggle('guest', r === 'GUEST');
  app.classList.toggle('landing', r === 'GUEST' && active === 'welcome');
  $('#guestbar').hidden = r !== 'GUEST';
  $('#gb-signin').hidden = active === 'welcome';
  const items = NAV.filter(n => n.roles.includes(r));
  $('#nav').innerHTML = items.map(n => `<a href="#/${n.id}" class="${n.danger ? 'danger' : ''}" ${n.id === active ? 'aria-current="page"' : ''}>${icon(n.icon)}<span>${esc(n.label)}</span></a>`).join('');
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#sidebar-foot').innerHTML = (state.user ? `<div class="userbox"><span class="avatar">${esc(initials(state.user.name))}</span>
      <span class="who"><b>${esc(state.user.name)}</b><span class="muted small">${esc(ROLE_NAME[state.user.role] || '')}</span></span></div>` : '')
    + `<div class="foot-actions">${state.user ? `<button class="btn secondary small" id="signout" style="flex:1">${icon('logout')}Sign out</button>` : ''}
      <button class="icon-btn" id="theme-btn" aria-label="Switch to ${dark ? 'light' : 'dark'} theme" title="Switch theme">${icon(dark ? 'sun' : 'moon')}</button></div>`;
  $('#theme-btn').onclick = () => {
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('hms.theme', next); } catch { /* ignore */ }
    render();
  };
  const out = $('#signout');
  if (out) out.onclick = async () => { try { await api('POST', '/api/auth/logout'); } catch { /* already gone */ } setSession(null); toast('Signed out.'); go('welcome'); };
  $('#app').classList.remove('nav-open');
}

async function render() {
  stopTimers();
  const r = role();
  let {page, param} = parseRoute();
  let item = NAV.find(n => n.id === page);
  if (!item || !item.roles.includes(r)) {
    if (r === 'GUEST' && NAV.some(n => n.id === page)) {
      try { sessionStorage.setItem('hms.next', location.hash); } catch { /* ignore */ }
      toast(page === 'bills' ? 'Please sign in to see this bill.' : 'Please sign in to continue.');
    }
    page = ROLE_HOME[r];
    param = null;
    item = NAV.find(n => n.id === page);
    history.replaceState(null, '', '#/' + page);
  }
  renderShell(page);
  $('#page-title').textContent = item.title;
  $('#page-sub').textContent = item.sub || '';
  $('#top-actions').innerHTML = '';
  document.title = `${item.title} · HMS`;
  const view = $('#page');
  view.innerHTML = '<div class="loading">Loading…</div>';
  try {
    await PAGES[page](view, param);
  } catch (e) {
    view.innerHTML = `<div class="card">${empty('alert', 'This page could not be loaded: ' + e.message)}</div>`;
  }
}

async function signedIn(result) {
  setSession(result);
  toast(`Welcome, ${result.user.name}.`);
  let next = null;
  try { next = sessionStorage.getItem('hms.next'); sessionStorage.removeItem('hms.next'); } catch { /* ignore */ }
  const nextPage = next ? next.replace(/^#\/?/, '').split('/')[0] : '';
  if (next && NAV.some(n => n.id === nextPage && n.roles.includes(result.user.role))) { if (location.hash === next) render(); else location.hash = next; } else go(ROLE_HOME[result.user.role]);
}

async function bookingDialog(doctorId) {
  const d = await attempt(() => api('GET', '/api/doctors/' + encodeURIComponent(doctorId)))();
  if (!d) return;
  const days = [];
  for (let i = 0; days.length < 14; i++) { const day = new Date(); day.setDate(day.getDate() + i); days.push(day); }
  const works = day => d.workingDays.includes(day.getDay() === 0 ? 7 : day.getDay());
  let chosenDay = isoDay(days.find(works) || days[0]);
  let chosenTime = null;
  const booked = await openModal({title: 'Book an appointment', wide: true,
    body: `<div class="doc-top" style="margin-bottom:12px"><span class="avatar" style="width:48px;height:48px">${esc(initials(d.name))}</span>
        <div><b>${esc(d.name)}</b><div class="muted small">${esc(d.specialization)} · ${esc(d.qualification || '')} · ${d.experienceYears} years · room ${esc(d.room)}</div>
        <div class="small">${money(d.feePaise)} consultation · ${icon('star')} ${d.rating.toFixed(1)}</div></div></div>
      <label>Day</label><div class="days" role="group" aria-label="Day">${days.map(day => `<button type="button" class="day" data-day="${isoDay(day)}" ${works(day) ? '' : 'disabled'} aria-pressed="false">
        <small>${day.toLocaleDateString('en-IN', {weekday: 'short'})}</small><b>${day.getDate()}</b><small>${day.toLocaleDateString('en-IN', {month: 'short'})}</small></button>`).join('')}</div>
      <div id="slot-area"></div>
      <label for="b-reason">Reason for the visit <span class="muted">(optional)</span></label><input id="b-reason" maxlength="300" placeholder="For example: follow-up, chest pain, routine check">`,
    actions: `<button class="btn secondary" data-close>Close</button><button class="btn" id="b-go" disabled>${state.user ? 'Book appointment' : 'Sign in to book'}</button>`,
    onMount: (root, close) => {
      const loadSlots = attempt(async () => {
        $$('.day', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === chosenDay)));
        chosenTime = null;
        $('#b-go').disabled = !!state.user;
        const slots = await api('GET', `/api/doctors/${encodeURIComponent(d.id)}/slots?date=${chosenDay}`);
        const group = (title, list) => list.length ? `<div class="slot-group"><h3>${title}</h3><div class="slots">${list.map(s =>
          `<button type="button" class="slot" data-time="${s.time}" aria-pressed="false" ${s.available ? '' : 'disabled aria-label="' + s.time + ', taken"'}>${s.time}</button>`).join('')}</div></div>` : '';
        const free = slots.filter(s => s.available).length;
        $('#slot-area', root).innerHTML = slots.length
          ? `<p class="small muted" style="margin-top:10px">${plural(free, 'free slot')} on ${esc(fmtDay(chosenDay))}</p>`
            + group('Morning', slots.filter(s => s.time < '12:00')) + group('Afternoon', slots.filter(s => s.time >= '12:00'))
          : `<p class="muted" style="margin-top:12px">${esc(d.name)} does not work on this day.</p>`;
        $$('.slot', root).forEach(b => { b.onclick = () => {
          chosenTime = b.dataset.time;
          $$('.slot', root).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          $('#b-go').disabled = false;
        }; });
      });
      $$('.day', root).forEach(b => { b.onclick = () => { chosenDay = b.dataset.day; loadSlots(); }; });
      $('#b-go').onclick = attempt(async () => {
        if (!state.user) { try { sessionStorage.setItem('hms.next', '#/doctors'); } catch { /* ignore */ } close(); go('welcome'); return; }
        try {
          const a = await api('POST', '/api/appointments', {doctorId: d.id, date: chosenDay, time: chosenTime, reason: $('#b-reason').value});
          close(a);
        } catch (e) {
          toast(e.message, true);
          if (e.status === 409) loadSlots();
        }
      });
      loadSlots();
    }});
  if (booked) {
    toast(`Booked: ${fmtDay(booked.date)} at ${booked.time} with ${booked.doctorName}.`);
    openModal({title: 'Appointment booked', body: `<div class="stack"><p>${statusChip('BOOKED')}</p>
        <p><b>${esc(booked.doctorName)}</b>, ${esc(fmtDay(booked.date))} at ${esc(booked.time)}</p>
        <p class="small muted">Appointment <span class="mono">${esc(booked.id)}</span> · bill <span class="mono">${esc(booked.billId)}</span>
        (both ids from the Snowflake generator)</p></div>`,
      actions: `<a class="btn secondary" href="#/bills/${esc(booked.billId)}" data-close>See the bill</a><a class="btn" href="#/appointments" data-close>My appointments</a>`});
  }
}

        <div class="body"><b>${esc(a.doctorName)}</b><span class="muted small">${esc(a.specialization)} · ${esc(fmtDay(a.date))} at ${esc(a.time)}${a.reason ? ' · ' + esc(a.reason) : ''}</span></div>

    $('#e-status').innerHTML = `<div class="card-head"><h2>Request status</h2>${statusChip(s.status)}</div>
      ${s.status === 'DISPATCHED' ? `<div class="muted small">Estimated arrival</div><div class="eta">${s.etaMinutes} <span style="font-size:18px">min</span></div>
        <p style="margin-top:8px"><b>${esc(s.ambulanceCallSign)}</b> is on the way to ${esc(s.zone)}.</p>`
      : s.status === 'QUEUED' ? `<div class="muted small">Position in queue</div><div class="eta">${s.queuePosition}</div><p style="margin-top:8px">All ambulances are busy. You will be assigned the next free one; more serious requests go first.</p>`
      : `<p>This request has been resolved.</p>`}
      <div class="row" style="margin-top:14px">${sevChip(s.severity)}<span class="mono">${esc(s.id)}</span><span class="spacer"></span>
      <button class="btn secondary small" id="e-refresh">${icon('refresh')}Refresh</button></div>`;
    $('#e-refresh').onclick = refresh;
  };
  const refresh = attempt(async () => { if (current) showStatus(await api('GET', '/api/emergency/' + current)); });
  $('#e-form').onsubmit = attempt(async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.severity = +body.severity;
    const s = await api('POST', '/api/emergency', body);
    current = s.id;
    try { sessionStorage.setItem('hms.emergency', s.id); } catch { /* ignore */ }
    showStatus(s);
    toast(s.status === 'DISPATCHED' ? `${s.ambulanceCallSign} dispatched, about ${s.etaMinutes} minutes away.` : 'All ambulances are busy: you are in the priority queue.');
  });
  if (current) { await refresh(); } else showIdle();
  every(() => { if (current) refresh(); }, 10000);
};

function dayPills(selected, count = 14) {
  const days = [];
  for (let i = -1; days.length < count; i++) { const d = new Date(); d.setDate(d.getDate() + i); days.push(d); }
  return `<div class="days" role="group" aria-label="Day">${days.map(d => `<button class="day" data-day="${isoDay(d)}" aria-pressed="${isoDay(d) === selected}">
    <small>${isoDay(d) === today() ? 'Today' : d.toLocaleDateString('en-IN', {weekday: 'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-IN', {month: 'short'})}</small></button>`).join('')}</div>`;
}

const COMPONENTS = [
  ['Rate limiter', 'gauge', 'Token bucket per client and request class'],
  ['Unique ID generator', 'hash', 'Snowflake ids for every record'],
  ['Autocomplete', 'zap', 'Trie index for doctor and medicine search'],
  ['URL shortener', 'link', 'Short links for sharing bills'],
  ['Web crawler', 'globe', 'Drug information and insurance plans'],
  ['Consistent hashing', 'activity', 'Picks the cache server for each key'],
  ['Key-value store', 'database', 'Distributed cache in front of MongoDB'],
];
const nodeColor = id => `var(--series-${((parseInt(String(id).replace(/\D/g, ''), 10) || 1) - 1) % 6 + 1})`;

PAGES.system = async view => {
  view.innerHTML = `<div class="grid cols-4" id="comp-tiles"></div>
    <section class="card"><div class="card-head"><h2>Key-value cache cluster</h2>
        <button class="btn secondary small" id="add-node">${icon('plus')}Add a server</button>
        <p>Each server is a separate TCP server. The consistent-hash ring decides which server holds each key. Stop one to simulate a failure: its keys fall to the next server and the application keeps working from MongoDB.</p></div>
      <div class="donut-wrap"><div id="ring"></div><div class="table-wrap" id="nodes"></div></div></section>
    <div class="grid cols-2">
      <section class="card"><div class="card-head"><h2>Requests per second</h2><span class="muted small">last 2 minutes · updates every 2 s</span></div><div id="ch-rps"></div></section>
      <section class="card"><div class="card-head"><h2>Cache hit ratio</h2><span class="muted small">share of cache lookups answered from the cache</span></div><div id="ch-hit"></div></section>
    </div>
    <details class="tableview"><summary>Table view of the two charts</summary><div class="card" style="margin-top:8px"><div class="table-wrap" id="ch-table"></div></div></details>
    <div class="grid split">
      <section class="card"><div class="card-head"><h2>Requests and rate limiting</h2>${powered('Rate limiter')}</div><div class="table-wrap" id="classes"></div></section>
      <div class="stack" style="gap:18px">
        <section class="card"><div class="card-head"><h2>Switches</h2><p>Turn a component off to compare the system with and without it.</p></div><div id="switches"></div></section>
        <section class="card"><div class="card-head"><h2>Rate limiter test</h2><p>Sends 30 wrong-password logins at once. Logins allow a burst of 10, then 1 per second.</p></div>
          <button class="btn secondary" id="flood">${icon('gauge')}Send 30 rapid logins</button><div id="flood-out" style="margin-top:12px"></div></section>
      </div></div>
    <div class="grid split">
      <section class="card"><div class="card-head"><h2>Web crawler</h2>${powered('Web crawler')}<button class="btn secondary small" id="crawl-go">${icon('refresh')}Run crawl now</button>
        <p>Crawls the two simulated external sites for drug reference pages and insurance plans.</p></div><div id="crawl"></div></section>
      <section class="card"><div class="card-head"><h2>Data and resources</h2></div><div id="resources"></div></section></div>`;

  const series = [];
  let prev = null;
  let lastRing = '';
  const rpsChart = lineChart($('#ch-rps'), {name: 'Requests per second', color: 'var(--chart-line)', format: (v, axis) => axis ? compact(v) : v.toFixed(1) + ' req/s'});
  const hitChart = lineChart($('#ch-hit'), {name: 'Cache hit ratio', color: 'var(--chart-line)', yMax: 1, format: v => Math.round(v * 100) + '%'});

  const refresh = async () => {
    const [cluster, m, crawl] = await Promise.all([api('GET', '/api/admin/cluster'), api('GET', '/api/admin/metrics'), api('GET', '/api/admin/crawl')]);
    if (parseRoute().page !== 'system') return;
    const now = Date.now();
    const totalReq = Object.values(m.requests).reduce((s, r) => s + r.requests, 0);
    const totalRej = Object.values(m.requests).reduce((s, r) => s + r.rejected, 0);
    if (prev) {
      const dt = (now - prev.t) / 1000;
      const lookups = (m.cache.hits - prev.hits) + (m.cache.misses - prev.misses);
      series.push({t: now, rps: Math.max(0, (totalReq - prev.req) / dt), hit: lookups > 0 ? (m.cache.hits - prev.hits) / lookups : null});
      while (series.length && now - series[0].t > 120000) series.shift();
    }
    prev = {t: now, req: totalReq, hits: m.cache.hits, misses: m.cache.misses};
    rpsChart.update(series.map(p => ({t: p.t, v: p.rps})));
    hitChart.update(series.map(p => ({t: p.t, v: p.hit})));
    $('#ch-table').innerHTML = `<table><tr><th>Seconds ago</th><th class="r">Requests per second</th><th class="r">Cache hit ratio</th></tr>${series.slice(-15).reverse().map(p =>
      `<tr><td>${Math.round((now - p.t) / 1000)}</td><td class="r num">${p.rps.toFixed(1)}</td><td class="r num">${p.hit == null ? '—' : pct(p.hit, 0)}</td></tr>`).join('')}</table>`;

    const up = cluster.nodes.filter(n => n.up);
    const last = crawl.lastRun || {};
    const tiles = [
      [`${compact(totalRej)}`, `rejected of ${compact(totalReq)} requests`],
      [`${compact(m.idGenerator.generated)}`, `ids issued by worker ${m.idGenerator.workerId}`],
      [`${compact(m.autocomplete.doctorEntries + m.autocomplete.medicineEntries)}`, `${m.autocomplete.doctorEntries} doctor and ${m.autocomplete.medicineEntries} medicine entries`],
      [`${compact(m.shortLinks.created)}`, `links created, ${m.shortLinks.collisions} collisions`],
      [last.pagesFetched != null ? compact(last.pagesFetched) : '—', last.pagesFetched != null ? `pages, ${last.insurancePlansStored} plans, ${Math.round(last.pagesPerSecond)} pages/s` : crawl.running ? 'crawling now…' : 'not run in this session'],
      [`${up.length} / ${cluster.nodes.length}`, `servers on the ring, ${cluster.virtualNodes} points each`],
      [pct(m.cache.hitRatio, 0), `hit ratio, ${cluster.replicas} copies of each key`],
    ];
    $('#comp-tiles').innerHTML = COMPONENTS.map(([name, ic, what], i) => `<div class="card comp"><div class="comp-head"><span class="qi">${icon(ic)}</span>${esc(name)}</div>
      <div class="k num">${esc(tiles[i][0])}</div><div class="muted small">${esc(tiles[i][1])}</div><div class="hint" style="margin-top:0">${esc(what)}</div></div>`).join('')
      + `<div class="card comp"><div class="comp-head"><span class="qi">${icon('database')}</span>MongoDB</div><div class="k num">${compact(m.data.patients)}</div>
        <div class="muted small">patients, ${compact(m.data.appointments)} appointments</div><div class="hint" style="margin-top:0">System of record</div></div>`;

    const ringKey = JSON.stringify(up.map(n => [n.id, n.ringShare, n.keys]));
    if (ringKey !== lastRing) { lastRing = ringKey; donut($('#ring'), up.map(n => ({label: n.id, value: n.ringShare, color: nodeColor(n.id), detail: `${n.keys ?? 0} keys`})),
      [String(up.length), up.length === 1 ? 'server up' : 'servers up']); }
    $('#nodes').innerHTML = `<table><thead><tr><th>Server</th><th>Status</th><th class="r">Share of ring</th><th class="r">Keys</th><th class="r">Hits / misses</th><th class="r">Requests</th><th></th></tr></thead><tbody>
      ${cluster.nodes.map(n => `<tr><td><span class="keydot" style="background:${n.up ? nodeColor(n.id) : 'var(--line-strong)'}"></span><b>${esc(n.id)}</b> <span class="muted small">:${n.port}</span></td>
        <td>${n.up ? `<span class="chip good">${icon('check')}Up</span>` : `<span class="chip bad">${icon('x')}Down</span>`}</td>
        <td class="r num">${n.up ? pct(n.ringShare) : '—'}</td><td class="r num">${n.keys ?? '—'}</td><td class="r num">${n.keys === undefined ? '—' : n.hits + ' / ' + n.misses}</td>
        <td class="r num">${compact(n.requests)}</td>
        <td class="r">${n.up ? `<button class="btn danger small" data-kill="${esc(n.id)}">Stop</button>` : `<button class="btn small" data-restart="${esc(n.id)}">Restart</button>`}</td></tr>`).join('')}</tbody></table>
      <p class="hint">${plural(cluster.failovers, 'failover')} so far. A restarted server comes back empty and refills as data is read.</p>`;
    $$('[data-kill]', view).forEach(b => { b.onclick = attempt(async () => {
      if (!await confirmDialog({title: `Stop cache server ${b.dataset.kill}?`, text: 'This simulates a crash. Everything it held in memory is lost. Requests keep working: its keys fall to the next server on the ring and are reloaded from MongoDB.', confirm: 'Stop server', danger: true})) return;
      await api('POST', `/api/admin/cluster/nodes/${b.dataset.kill}/kill`);
      toast(`Server ${b.dataset.kill} stopped. Watch the hit ratio dip and recover.`);
      refresh();
    }); });
    $$('[data-restart]', view).forEach(b => { b.onclick = attempt(async () => {
      await api('POST', `/api/admin/cluster/nodes/${b.dataset.restart}/restart`);
      toast(`Server ${b.dataset.restart} restarted. It rejoins the ring within a second.`);
      setTimeout(refresh, 1200);
    }); });

    $('#classes').innerHTML = `<table><thead><tr><th>Class</th><th>Limit per client</th><th class="r">Requests</th><th class="r">Rejected</th><th class="r">Avg time</th><th class="r">Clients</th></tr></thead><tbody>
      ${Object.entries(m.requests).map(([k, r]) => `<tr><td><b>${esc(k)}</b></td><td class="small">${r.ratePerSecond}/s, burst ${r.burst}</td><td class="r num">${compact(r.requests)}</td>
        <td class="r num">${compact(r.rejected)}${r.rejected ? ` <span class="muted small">(${pct(r.rejectionRate)})</span>` : ''}</td><td class="r num">${r.avgServiceMs.toFixed(2)} ms</td><td class="r num">${r.trackedClients}</td></tr>`).join('')}</tbody></table>`;
    $('#switches').innerHTML = [['cacheEnabled', 'Key-value cache', m.cache.enabled, 'Off: every read goes to MongoDB.'],
      ['rateLimitEnabled', 'Rate limiter', m.rateLimiterEnabled, 'Off: no request is ever refused.']].map(([key, name, on, note]) => `<div class="switch">
        <div><b>${name}</b><div class="hint" style="margin-top:0">${note}</div></div>
        <button class="toggle" role="switch" aria-checked="${on}" aria-label="${name}" data-switch="${key}"></button></div>`).join('');
    $$('[data-switch]', view).forEach(t => { t.onclick = attempt(async () => {
      await api('POST', '/api/admin/config', {[t.dataset.switch]: t.getAttribute('aria-checked') !== 'true'});
      refresh();
    }); });
    $('#crawl').innerHTML = crawl.running ? `<p>${chip('warn', 'clock', 'Crawling…')}</p>` : last.pagesFetched == null
      ? `<p class="muted">${last.error ? 'Last crawl failed: ' + esc(last.error) : 'Not run since the application started (data from an earlier run is kept).'}</p>`
      : `<div class="grid cols-3">${[['Pages fetched', last.pagesFetched], ['Pages per second', Math.round(last.pagesPerSecond)], ['Drugs / plans stored', `${last.drugPagesStored} / ${last.insurancePlansStored}`],
          ['Duplicate URLs skipped', last.duplicateUrlsSkipped], ['Duplicate pages skipped', last.duplicateContentSkipped], ['Blocked by robots.txt', last.blockedByRobots]]
          .map(([k, v]) => `<div><div class="muted small">${k}</div><div class="amount num" style="font-size:19px">${esc(v)}</div></div>`).join('')}</div>`;
    $('#crawl-go').disabled = crawl.running;
    const res = m.resources;
    $('#resources').innerHTML = `<div class="grid cols-2">${[['Patients', compact(m.data.patients)], ['Doctors', compact(m.data.doctors)], ['Appointments', compact(m.data.appointments)],
        ['Medical records', compact(m.data.records)], ['Bills', compact(m.data.bills)], ['Application heap', res.heapUsedMb.toFixed(0) + ' MB'],
        ['Application CPU', pct(Math.max(0, res.processCpuLoad))], ['Threads', res.threads]]
      .map(([k, v]) => `<div><div class="muted small">${k}</div><div class="amount num" style="font-size:19px">${esc(v)}</div></div>`).join('')}</div>`;
  };

  $('#add-node').onclick = attempt(async () => { await api('POST', '/api/admin/cluster/nodes'); toast('Server added to the ring. About a quarter of the keys now belong to it.'); refresh(); });
  $('#crawl-go').onclick = attempt(async () => { await api('POST', '/api/admin/crawl', {workers: 8, perHostDelayMs: 0}); toast('Crawl started.'); refresh(); });
  $('#flood').onclick = attempt(async () => {
    const codes = await Promise.all(Array.from({length: 30}, () => fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: 'nobody@hms.test', password: 'wrong-password'})}).then(r => r.status)));
    const count = c => codes.filter(s => s === c).length;
    $('#flood-out').innerHTML = `<div class="grid cols-2"><div><div class="muted small">Reached the password check (401)</div><div class="amount num">${count(401)}</div></div>
      <div><div class="muted small">Refused by the rate limiter (429)</div><div class="amount num">${count(429)}</div></div></div>`;
    refresh();
  });
  await refresh();
  every(attempt(refresh), 2000);
};

// ===== start ====================================================================================

(async () => {
  try { const t = localStorage.getItem('hms.theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* ignore */ }
  $('#menu-btn').innerHTML = icon('menu');
  $('#menu-btn').onclick = () => $('#app').classList.toggle('nav-open');
  $('#scrim').onclick = () => $('#app').classList.remove('nav-open');
  if (state.token) {
    try { state.user = (await api('GET', '/api/me')).user; } catch { setSession(null); }
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
